<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barang habis - Stok Gudang SPPG</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav id="nav"></nav>
<main id="v"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
<script>
boot("habis","Barang habis",function(){return'<div class="card">'+tbl(["Barang","Gudang","#Stok","#Minimum","Status"],low().map(function(i){return'<tr><td>'+esc(i.nama)+'</td><td>'+i.gudang+'</td><td class="n">'+stok(i)+' '+esc(i.sat)+'</td><td class="n">'+i.min+'</td><td>'+status(i)+'</td></tr>'}).join(""))+'</div><p class="mute">Barang tidak muncul di sini jika label pantau dimatikan di Data barang.</p>'});
</script>
</body>
</html>
