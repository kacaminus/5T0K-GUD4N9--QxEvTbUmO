<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cetak PDF - Stok Gudang SPPG</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#9C99E4">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
</head>
<body>
<nav id="nav"></nav>
<main id="v"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
<script>
var KOP='<div class="kop"><img src="img/logo.png" alt="Logo"><div class="kt"><b>SPPG SIDOARJO TULANGAN TULANGAN</b><b>YAYASAN PAUD PSM SURODADI</b><i>Jl. Raya Tulangan No 38, Desa Kenongo,<br>Kecamatan Tulangan, Kabupaten Sidoarjo, Provinsi Jawa Timur 61273</i></div></div>';
boot("cetak","Cetak PDF",function(){var d=today();return'<div class="row noprint"><label>Jenis laporan<select id="cj" onchange="gantiJenis()"><option value="opname">Stock opname (formulir)</option><option value="harian">Laporan harian (per tanggal)</option></select></label><label>Gudang<select id="cg" onchange="prev()">'+opt(G,F.g||gudangDipilih())+'</select></label><label>Dari<input type="date" id="c1" value="'+(F.d1||d.slice(0,8)+"01")+'"></label><label>Sampai<input type="date" id="c2" value="'+(F.d2||d)+'"></label><label id="lbHari" style="display:none">Tanggal per tabel (1-10)<input type="number" id="ch" min="1" max="10" value="7" style="width:90px" onchange="prev()"></label><label class="chk"><input type="checkbox" id="cs" checked onchange="prev()"> Tampilkan barang dengan stok kosong</label><label class="chk" id="lbAo"><input type="checkbox" id="ca" onchange="prev()"> Cetak stok awal saja (kolom lain dikosongkan)</label><button class="b p" onclick="prev()">Tampilkan</button><button class="b" onclick="window.print()">Cetak / Simpan PDF</button></div><div class="card" id="pv"><div class="empty">Pilih gudang dan periode, lalu klik Tampilkan.</div></div>'});
function fmt(d){return d?d.split("-").reverse().join("/"):""}
function prev(){var g=val("cg"),a=val("c1"),b=val("c2"),all=document.getElementById("cs").checked,ao=document.getElementById("ca").checked;F.g=g;F.d1=a;F.d2=b;
var har=val("cj")==="harian";setKertas(har);if(har){cetakHarian(g,a,b,all);return}
var rows="";S.items.filter(function(i){return i.gudang===g}).sort(function(a,b){return a.nama.localeCompare(b.nama,"id",{sensitivity:"base",numeric:true})}).forEach(function(i){units(i).forEach(function(u){var c=calc(i,a,b,u);if(u!==i.sat&&!(ao?c.awal:(c.awal||c.masuk||c.keluar)))return;if(!all&&(ao?c.awal:c.real)===0)return;rows+='<tr><td>'+esc(i.nama)+(u===i.sat?"":" ("+esc(u)+")")+'</td><td>'+c.awal+'</td>'+(ao?'<td></td><td></td><td></td><td></td>':'<td>'+c.keluar+'</td><td>'+Math.max(0,c.sisa)+'</td><td>'+c.masuk+'</td><td>'+c.real+'</td>')+'</tr>'})});
document.title="Stock Opname Gudang "+g+" "+a+" sd "+b;document.getElementById("pv").innerHTML='<table class="pgw"><thead><tr><td class="sp"></td></tr></thead><tbody><tr><td>'+KOP+'<div class="jud">STOCK OPNAME</div><div class="tg"><span><b>Tanggal:</b> '+fmt(a)+' s/d '+fmt(b)+'</span><span><b>Gudang:</b> '+g+'</span></div><div class="sheet">'+tbl(["Nama Barang","Stock awal","Terpakai","Sisa stock","Masuk","Stock real"],rows).replace("<table><tr>","<table><thead><tr>").replace("</tr>","</tr></thead>")+'</div></td></tr></tbody><tfoot><tr><td class="sp"></td></tr></tfoot></table>'}
function setKertas(l){var s=document.getElementById("pgstyle");if(!s){s=document.createElement("style");s.id="pgstyle";document.head.appendChild(s)}s.textContent="@page{size:A4"+(l?" landscape":"")+";margin:0}.blk+.blk{break-before:page;page-break-before:always;margin-top:14px}.hr th,.hr td{font-size:11px;padding:1px 3px}.hr th{line-height:1.2}"}
function gantiJenis(){var h=val("cj")==="harian";document.getElementById("lbHari").style.display=h?"":"none";document.getElementById("lbAo").style.display=h?"none":"";prev()}
function PGW(h){return'<table class="pgw"><thead><tr><td class="sp"></td></tr></thead><tbody><tr><td>'+h+'</td></tr></tbody><tfoot><tr><td class="sp"></td></tr></tfoot></table>'}
function dayList(a,b){var o=[],d=new Date(a+"T00:00:00Z"),e=new Date(b+"T00:00:00Z");if(isNaN(d)||isNaN(e))return o;while(d<=e){o.push(d.toISOString().slice(0,10));d.setUTCDate(d.getUTCDate()+1)}return o}
function sh(d){return d.slice(8,10)+"/"+d.slice(5,7)}
function cetakHarian(g,a,b,all){var pv=document.getElementById("pv"),days=dayList(a,b);
if(!days.length){pv.innerHTML='<div class="empty">Isi tanggal Dari dan Sampai (Sampai tidak boleh sebelum Dari).</div>';return}
if(days.length>93){pv.innerHTML='<div class="empty">Maksimal 93 hari per laporan. Perpendek periodenya.</div>';return}
var n=Math.max(1,Math.min(10,parseInt(val("ch"))||7)),r=function(x){return Math.round(x*1000)/1000},idx={},blocks=Math.ceil(days.length/n),out="";
S.tx.forEach(function(t){var it=item(t.item);if(!it)return;var k=t.item+"|"+(t.sat||it.sat)+"|"+t.tgl+"|"+t.jenis;idx[k]=(idx[k]||0)+t.jml});
var its=S.items.filter(function(i){return i.gudang===g}).sort(function(x,y){return x.nama.localeCompare(y.nama,"id",{sensitivity:"base",numeric:true})});
for(var s0=0;s0<days.length;s0+=n){var ds=days.slice(s0,s0+n),rows="";
its.forEach(function(i){units(i).forEach(function(u){var aw=calc(i,ds[0],"",u).awal,tm=0,tk=0,cells="";
ds.forEach(function(d){var m=r(idx[i.id+"|"+u+"|"+d+"|masuk"]||0),k=r(idx[i.id+"|"+u+"|"+d+"|keluar"]||0);tm+=m;tk+=k;cells+='<td>'+(m||"")+'</td><td>'+(k||"")+'</td>'});
tm=r(tm);tk=r(tk);if(!(aw||tm||tk)&&(!all||u!==i.sat))return;
rows+='<tr><td>'+esc(i.nama)+(u===i.sat?"":" ("+esc(u)+")")+'</td><td>'+aw+'</td>'+cells+'<td>'+tm+'</td><td>'+tk+'</td><td>'+r(aw+tm-tk)+'</td></tr>'})});
var h1='<tr><th rowspan="2">Nama Barang</th><th rowspan="2">Stok awal</th>'+ds.map(function(d){return'<th colspan="2">'+sh(d)+'</th>'}).join("")+'<th colspan="2">Total</th><th rowspan="2">Stok Akhir/<br>Stok real</th></tr>';
var h2='<tr>'+ds.map(function(){return'<th>Masuk</th><th>Keluar</th>'}).join("")+'<th>Masuk</th><th>Keluar</th></tr>';
out+='<div class="blk">'+(blocks>1?'<div class="tg"><span><b>Tanggal:</b> '+fmt(ds[0])+' s/d '+fmt(ds[ds.length-1])+'</span></div>':"")+'<div class="sheet"><div class="tw"><table class="hr"><thead>'+h1+h2+'</thead>'+(rows||'<tr><td colspan="'+(ds.length*2+5)+'" class="empty">Belum ada data.</td></tr>')+'</table></div></div></div>'}
document.title="Laporan Harian Gudang "+g+" "+a+" sd "+b;
pv.innerHTML=PGW(KOP+'<div class="jud">LAPORAN HARIAN STOK GUDANG '+g.toUpperCase()+'</div><div class="tg"><span><b>Periode:</b> '+fmt(a)+' s/d '+fmt(b)+'</span><span><b>Gudang:</b> '+g+'</span></div>'+out)}
</script>
</body>
</html>
