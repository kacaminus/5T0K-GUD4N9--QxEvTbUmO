<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cetak PDF - Stok Gudang SPPG</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav id="nav"></nav>
<main id="v"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
<script>
boot("cetak","Cetak PDF",function(){var d=today();return'<div class="row noprint"><label>Gudang<select id="cg" onchange="prev()">'+opt(G,F.g||gudangDipilih())+'</select></label><label>Dari<input type="date" id="c1" value="'+(F.d1||d.slice(0,8)+"01")+'"></label><label>Sampai<input type="date" id="c2" value="'+(F.d2||d)+'"></label><label class="chk"><input type="checkbox" id="cs" checked onchange="prev()"> Tampilkan barang dengan stok kosong</label><label class="chk"><input type="checkbox" id="ca" onchange="prev()"> Cetak stok awal saja (kolom lain dikosongkan)</label><button class="b p" onclick="prev()">Tampilkan</button><button class="b" onclick="window.print()">Cetak / Simpan PDF</button></div><div class="card" id="pv"><div class="empty">Pilih gudang dan periode, lalu klik Tampilkan.</div></div>'});
function fmt(d){return d?d.split("-").reverse().join("/"):""}
function prev(){var g=val("cg"),a=val("c1"),b=val("c2"),all=document.getElementById("cs").checked,ao=document.getElementById("ca").checked;F.g=g;F.d1=a;F.d2=b;
var rows="";S.items.filter(function(i){return i.gudang===g}).sort(function(a,b){return a.nama.localeCompare(b.nama,"id",{sensitivity:"base",numeric:true})}).forEach(function(i){units(i).forEach(function(u){var c=calc(i,a,b,u);if(u!==i.sat&&!(ao?c.awal:(c.awal||c.masuk||c.keluar)))return;if(!all&&(ao?c.awal:c.real)===0)return;rows+='<tr><td>'+esc(i.nama)+(u===i.sat?"":" ("+esc(u)+")")+'</td><td>'+c.awal+'</td>'+(ao?'<td></td><td></td><td></td><td></td>':'<td>'+c.keluar+'</td><td>'+c.sisa+'</td><td>'+c.masuk+'</td><td>'+c.real+'</td>')+'</tr>'})});
document.title="Stock Opname Gudang "+g+" "+a+" sd "+b;document.getElementById("pv").innerHTML='<table class="pgw"><thead><tr><td class="sp"></td></tr></thead><tbody><tr><td><div class="kop"><img src="img/logo.png" alt="Logo"><div class="kt"><b>SPPG SIDOARJO TULANGAN TULANGAN</b><b>YAYASAN PAUD PSM SURODADI</b><i>Jl. Raya Tulangan No. 38, Desa Kenongo, Kec. Tulangan, Kabupaten Sidoarjo, Jawa Timur 61273</i></div></div><div class="jud">STOCK OPNAME</div><div class="tg"><span><b>Tanggal:</b> '+fmt(a)+' s/d '+fmt(b)+'</span><span><b>Gudang:</b> '+g+'</span></div><div class="sheet">'+tbl(["Nama Barang","Stock awal","Terpakai","Sisa stock","Masuk","Stock real"],rows).replace("<table><tr>","<table><thead><tr>").replace("</tr>","</tr></thead>")+'</div></td></tr></tbody><tfoot><tr><td class="sp"></td></tr></tfoot></table>'}
</script>
</body>
</html>
