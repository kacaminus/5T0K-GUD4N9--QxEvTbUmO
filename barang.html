<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Data barang - Stok Gudang SPPG</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav id="nav"></nav>
<main id="v"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
<script>
boot("barang","Data barang",function(){return'<div class="card"><b>Tambah barang</b><div class="mute" style="margin-top:6px">Gudang tujuan barang baru (pilihan diingat, tidak perlu dipilih ulang)</div>'+pilihGudang()+'<div class="row"><label>Nama<input id="bn" onkeydown="if(event.key===\'Enter\')addItem()"></label><label>Satuan utama<select id="bs">'+opt(U)+'</select></label><label>Stok awal<input id="ba" type="number" min="0" step="any" value="0" style="width:90px"></label><label>Minimum<input id="bm" type="number" min="0" step="any" value="0" style="width:90px"></label><button class="b p" onclick="addItem()">Tambah</button></div></div><div class="row"><label>Gudang<select id="fg" onchange="filt()">'+opt(G,F.g,"Semua")+'</select></label><label>Cari<input id="fq" value="'+esc(F.q)+'" oninput="filt()"></label></div><div class="card">'+
tbl(["Barang","Gudang","Satuan utama","#Stok awal","#Minimum","Pantau",""],S.items.filter(function(i){return(!F.g||i.gudang===F.g)&&i.nama.toLowerCase().indexOf(F.q.toLowerCase())>-1}).map(function(i){return'<tr><td>'+esc(i.nama)+'</td><td>'+i.gudang+'</td><td><select onchange="upd(\''+i.id+'\',\'sat\',this.value)">'+opt(U.indexOf(i.sat)<0?U.concat([i.sat]):U,i.sat)+'</select></td><td class="n"><input type="number" min="0" step="any" value="'+i.awal+'" style="width:80px" onchange="upd(\''+i.id+'\',\'awal\',this.value)"></td><td class="n"><input type="number" min="0" step="any" value="'+i.min+'" style="width:80px" onchange="upd(\''+i.id+'\',\'min\',this.value)"></td><td><input type="checkbox" '+(i.pantau?"checked":"")+' onchange="upd(\''+i.id+'\',\'pantau\',this.checked)"></td><td><button class="b d" onclick="delItem(\''+i.id+'\')">Hapus</button></td></tr>'}).join(""))+'</div>'});
async function addItem(){var n=val("bn").replace(/\s+/g," ").trim();if(!n)return;var g=gudangDipilih(),k=n.toLowerCase(),sama=S.items.filter(function(i){return i.nama.trim().toLowerCase()===k});
if(sama.some(function(i){return i.gudang===g})){alert('"'+n+'" sudah ada di Gudang '+g+'. Barang yang sama tidak bisa ditambahkan lagi.');return}
if(sama.length&&!confirm('"'+n+'" sudah ada di Gudang '+sama[0].gudang+'. Tetap tambahkan ke Gudang '+g+'?'))return;try{await DB.addItem({nama:n,gudang:g,sat:val("bs"),min:+val("bm")||0,awal:+val("ba")||0});await reload();document.getElementById("bn").focus()}catch(e){alert(e.code==="23505"?"Barang itu sudah ada di gudang tersebut.":"Gagal menyimpan: "+e.message)}}
async function upd(id,k,v){var it=item(id);v=k==="pantau"||k==="sat"?v:Math.max(0,+v||0);try{await DB.updItem(id,{[k]:v});it[k]=v}catch(e){alert("Gagal menyimpan: "+e.message);reload()}}
async function delItem(id){var it=item(id);if(!confirm("Hapus "+it.nama+" beserta riwayatnya?"))return;try{await DB.delItem(id);await reload()}catch(e){alert("Gagal menghapus: "+e.message)}}
</script>
</body>
</html>
