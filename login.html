<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masuk - Stok Gudang SPPG</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main style="max-width:380px;margin-top:40px">
<h1>Stok Gudang SPPG</h1>
<div class="panel">
<div class="row" style="flex-direction:column;align-items:stretch">
<label>Email<input id="e" type="email" autocomplete="username"></label>
<label>Kata sandi<input id="p" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')masuk()"></label>
<button class="b p" onclick="masuk()">Masuk</button>
</div>
<div id="msg" class="mute"></div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
<script>
DB.user().then(function(u){if(u)location.href="index.html"}).catch(function(){});
async function masuk(){msg("Memeriksa...");try{var r=await DB.login(val("e").trim(),val("p"));if(r.error)msg("Email atau kata sandi salah.");else location.href="index.html"}catch(e){msg("Tidak bisa terhubung: "+e.message)}}
</script>
</body>
</html>
