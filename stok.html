<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stok barang - Stok Gudang SPPG</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav id="nav"></nav>
<main id="v"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
<script>
boot("stok","Stok barang",function(){var r=S.items.filter(function(i){return(!F.g||i.gudang===F.g)&&i.nama.toLowerCase().indexOf(F.q.toLowerCase())>-1});
return'<div class="row"><label>Gudang<select id="fg" onchange="filt()">'+opt(G,F.g,"Semua")+'</select></label><label>Cari<input id="fq" value="'+esc(F.q)+'" oninput="filt()"></label></div><div class="card">'+
tbl(["Barang","Gudang","Stok","Status"],r.map(function(i){return'<tr><td>'+esc(i.nama)+'</td><td>'+i.gudang+'</td><td>'+stokTxt(i)+'</td><td>'+status(i)+'</td></tr>'}).join(""))+'</div>'});
</script>
</body>
</html>
